services:
  - type: web
    name: stocktower
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt vendor/fubon_neo-2.3.0-cp37-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /healthz
    envVars:
      - key: FUBON_ID
        sync: false
      - key: FUBON_API_KEY
        sync: false
      - key: FUBON_PASSWORD
        sync: false
      - key: FUBON_CERT_PASS
        sync: false
      - key: FUBON_CERT_B64
        sync: false
      - key: FUBON_CERT_PATH
        value: /tmp/fubon_cert.pfx
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DRY_RUN
        value: "true"